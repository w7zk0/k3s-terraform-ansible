---
- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download and install k3s server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server \
      {{ k3s_server_args | join(' ') }}
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Wait for k3s to be ready
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    state: present
    timeout: 120

- name: Get node token
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token

- name: Set k3s token fact
  set_fact:
    k3s_token: "{{ node_token.content | b64decode | trim }}"

- name: Make sure k3s service is enabled and running
  service:
    name: k3s
    state: started
    enabled: true

- name: Display kubeconfig location
  debug:
    msg: "Kubeconfig available at /etc/rancher/k3s/k3s.yaml on the server"
