---
- name: Check if k3s agent is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Get k3s token from server
  set_fact:
    k3s_token: "{{ hostvars[groups['server'][0]]['k3s_token'] }}"
  when: k3s_token is not defined

- name: Download and install k3s agent
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ hostvars[groups['server'][0]]['ansible_host'] }}:6443" \
      K3S_TOKEN="{{ k3s_token }}" \
      INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - agent \
      {{ k3s_agent_args | join(' ') }}
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Ensure k3s-agent service is running
  service:
    name: k3s-agent
    state: started
    enabled: true
