---
- name: Bootstrap common configuration on all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - common

- name: Install k3s server (control-plane)
  hosts: server
  become: true
  roles:
    - k3s_server

- name: Install k3s agents (workers)
  hosts: agents
  become: true
  roles:
    - k3s_agent
